<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>やさいっこ畑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: 左に畑（キャンバス）、右に帳面（お店・図鑑のタブ）。スマホでは畑→帳面の一列。 */
:root{
  --bg:#eef2e4;
  --panel:#ffffff;
  --panel-2:#f4f6ec;
  --line:#d9dfc8;
  --ink:#2d2b22;
  --muted:#6e7160;
  --leaf:#4b9437;
  --soil:#8a5a35;
  --accent:#e2702a;
  --accent-ink:#ffffff;
  --rare:#c9971c;
  --dot:rgba(75,148,55,.10);
  --shadow:0 2px 0 rgba(60,70,40,.08),0 14px 30px -20px rgba(40,50,20,.45);
  --display:"Mochiy Pop One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191c14;--panel:#23271d;--panel-2:#2b3024;--line:#3a4030;--ink:#eef0e4;--muted:#a3a792;
  --leaf:#7cc265;--soil:#c48a5a;--accent:#f08a48;--accent-ink:#2a1405;--rare:#f0c64a;--dot:rgba(124,194,101,.07);--shadow:0 2px 0 rgba(0,0,0,.25),0 14px 30px -18px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191c14;--panel:#23271d;--panel-2:#2b3024;--line:#3a4030;--ink:#eef0e4;--muted:#a3a792;
  --leaf:#7cc265;--soil:#c48a5a;--accent:#f08a48;--accent-ink:#2a1405;--rare:#f0c64a;--dot:rgba(124,194,101,.07);--shadow:0 2px 0 rgba(0,0,0,.25),0 14px 30px -18px rgba(0,0,0,.6);color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{background-image:radial-gradient(var(--dot) 1.4px,transparent 1.6px),radial-gradient(var(--dot) 1.4px,transparent 1.6px);background-size:28px 28px;background-position:0 0,14px 14px}
body{
  font-family:var(--body);font-weight:500;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 48px;-webkit-tap-highlight-color:transparent
}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 20px}
h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15;margin:0;color:var(--leaf)}
.sub{margin:2px 0 0;font-size:13px;color:var(--muted)}
.purse{text-align:right}
.coins{font-family:var(--display);font-size:clamp(24px,5vw,32px);line-height:1.1;font-variant-numeric:tabular-nums}
.coins small{font-family:var(--body);font-size:13px;color:var(--muted);margin-right:4px}
.dexline{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:920px){.grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}.farm{position:sticky;top:16px;align-self:start}}

.farm{display:flex;flex-direction:column;gap:10px;min-width:0}
.stages{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.stages button{
  flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:5px 14px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px
}
.stages button[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff;font-weight:700}
.stages button.locked{color:var(--muted);border-style:dashed;cursor:default}
.stages .n{font-size:11px;min-width:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-align:center}
#cv{display:block;width:100%;border-radius:16px;touch-action:none;cursor:grab;background:var(--panel-2)}
.farmbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.status{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.status b{color:var(--ink)}
.btn{border:0;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn[aria-disabled="true"]{background:var(--panel-2);color:var(--muted);cursor:default}

.book{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tabs{display:flex;gap:4px;background:var(--panel-2);border-radius:999px;padding:3px;align-self:flex-start}
.tabs button{border:0;background:transparent;border-radius:999px;padding:5px 16px;cursor:pointer;font-weight:700;color:var(--muted);font-size:14px}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.shop{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.item .nm{font-weight:700;font-size:15px}
.item .lv{font-size:12px;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.item .ds{font-size:12px;color:var(--muted);line-height:1.5}
.buy{border:0;border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:700;background:var(--leaf);color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}
.buy.poor{background:var(--panel-2);color:var(--muted);cursor:default}
.buy.done{background:transparent;color:var(--muted);cursor:default}

.dexhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.dexhead strong{font-family:var(--display);font-weight:400;font-size:18px}
.prog{height:8px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--leaf);border-radius:999px}
.detail{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--panel-2)}
.detail canvas{width:96px;height:112px}
.detail .dn{font-family:var(--display);font-size:18px;line-height:1.3}
.detail .dm{font-size:12px;color:var(--muted)}
.detail .dd{font-size:13px;margin-top:2px}
.stars{color:var(--rare);letter-spacing:1px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:4px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card canvas{width:64px;height:72px}
.card span{font-size:11px;line-height:1.3;text-align:center;min-height:2.6em;display:flex;align-items:center}
.card.unknown span{color:var(--muted)}
.stg{font-size:12px;color:var(--muted);margin:6px 0 2px;grid-column:1/-1;font-weight:700;font-variant-numeric:tabular-nums}
.stg.done{color:var(--rare)}
.shophead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.shophead:first-child{margin-top:0}
.shophead strong{font-family:var(--display);font-weight:400;font-size:16px}
.shophead span{font-size:12px;color:var(--muted)}
.wx{font-size:13px;font-weight:700;padding:6px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.wx.ame{border-color:#6f93c4}
.wx.niji{border-color:var(--rare)}
.welcome{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--leaf)}
.welcome p{margin:0;font-size:14px}
.tip{margin:0;font-size:12px;color:var(--muted)}
.views{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.views button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 10px;cursor:pointer;font-family:var(--display);font-size:16px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.views button[aria-selected="true"]{background:var(--leaf);color:#fff}
.views .n{font-family:var(--body);font-size:11px;font-weight:700;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.meter{display:inline-block;width:70px;height:6px;border-radius:999px;background:var(--panel-2);vertical-align:middle;margin-left:4px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--leaf)}
.meter.full i{background:#d9543f}
.stall{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-h strong{font-family:var(--display);font-weight:400;font-size:16px}
.sec-h span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.shelf{display:flex;flex-direction:column;gap:6px}
.slot{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.slot canvas{width:48px;height:54px}
.slot .nm{font-weight:700;font-size:14px;line-height:1.3}
.slot .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot .meta.out{color:#d9543f;font-weight:700}
.slot.empty{border-style:dashed;grid-template-columns:minmax(0,1fr);color:var(--muted);font-size:13px}
.slot-ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.price{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--panel-2)}
.price button{border:0;background:transparent;border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer;color:var(--muted)}
.price button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.x{border:0;background:var(--panel-2);border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--muted)}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.invi{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-align:left;cursor:pointer}
.invi canvas{width:36px;height:40px}
.invi .nm{font-size:13px;font-weight:700;line-height:1.3}
.invi .meta{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.invi.on{border-color:var(--leaf);cursor:default}
.invi.on .meta{color:var(--leaf);font-weight:700}
.invi[aria-disabled="true"]{cursor:default}
.ghost[aria-disabled="true"]{opacity:.5;cursor:default}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:13px}
.legend{font-size:12px;color:var(--muted);margin:0}
.coins.bump{animation:bump .3s ease-out}
@keyframes bump{40%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.coins.bump{animation:none}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.reset{align-self:flex-start;border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.confirm button{border:0;border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:700;background:var(--panel-2)}
.confirm .danger{background:#d9543f;color:#fff}

.brand{display:flex;align-items:center;gap:12px;min-width:0}
#logo{width:56px;height:56px;flex:0 0 auto;border-radius:16px;background:var(--panel);box-shadow:var(--shadow)}
h1{font-size:30px;letter-spacing:.02em;text-shadow:0 2px 0 var(--dot)}
.sound{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.snd{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px 5px 8px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);box-shadow:var(--shadow);transition:transform .12s}
.snd i{font-style:normal;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:var(--panel-2);font-size:13px}
.snd[aria-pressed="true"]{color:var(--ink)}
.snd[aria-pressed="true"] i{background:var(--accent);color:var(--accent-ink);animation:beat 1s ease-in-out infinite}
.snd.wait{border-color:var(--accent);color:var(--accent);animation:nudge 1.6s ease-in-out infinite}
.snd.wait i{animation:none}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(-2px)}}
.snd[aria-pressed="false"] span{text-decoration:line-through;text-decoration-color:var(--muted)}
@keyframes beat{50%{transform:scale(1.15) rotate(-8deg)}}
.book,#cv,.views,.welcome{box-shadow:var(--shadow)}
#cv{border:3px solid var(--panel)}
.item,.slot,.invi,.card{transition:transform .12s,box-shadow .12s,border-color .12s}
.item:hover,.invi:not(.on):hover,.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.buy,.btn,.ghost,.views button,.tabs button,.price button,.x{transition:transform .08s,background-color .15s}
.buy:active,.btn:active,.ghost:active,.views button:active,.snd:active,.x:active{transform:scale(.95)}
.buy:not(.poor):not(.done){box-shadow:0 3px 0 rgba(0,0,0,.18)}
.toast{animation:toastIn .25s ease-out}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}
.views button[aria-selected="true"]{box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
@media (prefers-reduced-motion:reduce){.snd i,.snd.wait{animation:none!important}.toast{animation:none}.item,.invi,.card{transition:none}}

.quick{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.quick-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.quick-h strong{font-family:var(--display);font-weight:400;font-size:15px}
.qcount{font-size:12px;font-weight:700;color:var(--accent)}
.link{margin-left:auto;border:0;background:none;color:var(--leaf);font-weight:700;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:2px 0}
.qrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.qk{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr);grid-template-areas:"b t" "p p" "g g";gap:2px 8px;align-items:center;text-align:left;padding:8px 10px 9px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel-2);cursor:pointer;transition:transform .1s,border-color .15s,background-color .15s}
.qk .qb{grid-area:b;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-size:16px;color:#fff;background:var(--muted)}
.qk .qt{grid-area:t;display:flex;flex-direction:column;min-width:0}
.qk .qn{font-weight:700;font-size:13px;line-height:1.3}
.qk .qe{font-size:11px;color:var(--muted);line-height:1.35;font-variant-numeric:tabular-nums}
.qk .qp{grid-area:p;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.qk .pbar{grid-area:g}
.qk.ok{border-color:var(--accent);background:var(--panel)}
.qk.ok .qb{background:var(--accent);color:var(--accent-ink)}
.qk.ok .qp{color:var(--accent)}
.qk.ok:hover{transform:translateY(-2px)}
.qk:active{transform:scale(.96)}
.qk[aria-disabled="true"]{cursor:default}
.qk.fresh{animation:fresh 1.1s ease-out}
@keyframes fresh{0%{box-shadow:0 0 0 0 var(--accent)}40%{transform:scale(1.04)}100%{box-shadow:0 0 0 10px transparent}}
.pbar{display:block;height:5px;border-radius:999px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--muted);border-radius:999px;transition:width .4s}
.ok .pbar i{background:var(--accent)}
.need{display:flex;align-items:center;gap:8px;margin-top:4px}
.need .pbar{flex:1;max-width:140px}
.needt{font-size:11px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.item.ok{border-color:var(--accent)}
.item.ok .needt{color:var(--accent)}
.tabs .n{font-size:11px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);margin-left:2px}
@media (prefers-reduced-motion:reduce){.qk.fresh{animation:none}.pbar i{transition:none}}

.rank{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:2px;font-size:12px}
.rlv{font-family:var(--display);color:var(--accent);font-size:14px}
.rtitle{font-weight:700}
.rbar{width:80px;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.rbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--rare));transition:width .4s}
.banner{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,var(--rare),var(--accent));color:#fff;box-shadow:var(--shadow)}
.banner strong{font-family:var(--display);font-weight:400;font-size:20px;display:block}
.banner p{margin:2px 0 0;font-size:13px;font-weight:700}
.banner .btn{background:#fff;color:var(--accent)}
.banner.pop{animation:bannerIn .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes bannerIn{from{transform:scale(.7);opacity:0}}
.wx.sale{border-color:var(--accent);color:var(--accent)}
.pill-req{border:0;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--leaf);color:#fff;cursor:pointer;animation:nudge 1.6s ease-in-out infinite}
.reqs,.achs{display:flex;flex-direction:column;gap:8px}
.req{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.req canvas{width:48px;height:54px}
.req.ok{border-color:var(--leaf);box-shadow:0 0 0 1px var(--leaf)}
.req.empty{grid-template-columns:1fr;border-style:dashed;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.rwho{font-size:12px;color:var(--muted);font-weight:700}
.rwant{font-weight:700;font-size:14px;line-height:1.4}
.rhave{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rhave.ok{color:var(--leaf);font-weight:700}
.rrew{font-size:12px;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.link:disabled{color:var(--muted);text-decoration:none;cursor:default}
.ach{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.ach.ok{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ach.done{opacity:.7}
.aname{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-weight:700}
.astars{color:var(--rare);font-size:12px;letter-spacing:1px}
.agoal{font-size:12px;color:var(--muted)}
.card{position:relative}
.card .kira{position:absolute;top:3px;right:5px;font-style:normal;color:var(--rare);font-size:14px;text-shadow:0 0 6px var(--rare)}
.tabs{flex-wrap:wrap}
.tabs button{padding:5px 12px}
@media (prefers-reduced-motion:reduce){.banner.pop,.pill-req{animation:none}}

.kitchen{display:flex;flex-direction:column;gap:10px}
.recipes{display:flex;flex-direction:column;gap:6px}
.recipe{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.recipe canvas{width:48px;height:48px}
.recipe.ok{border-color:var(--accent)}
.recipe.unknown{grid-template-columns:48px minmax(0,1fr);opacity:.75}
.recipe .nm{font-weight:700;font-size:14px}
.ings{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0}

 {id:'suika',name:'すいか',st:4,r:2,val:2200,shape:'round',col:'#3f9a4a',sh:'#2e7a37',leaf:'tuft',face:'smile',ext:['stripes'],desc:'土の中で育ったすいか。本人がいちばん驚いている。'},

 {id:'takara',name:'たからばこ',st:4,r:4,val:60000,shape:'chest',col:'#8a5a2e',sh:'#6b4320',desc:'中身はからっぽ。でも箱そのものが高く売れた。'}
];
const SPI={};SP.forEach(s=>SPI[s.id]=s);
const STARS=r=>'★'.repeat(r)+'☆'.repeat(4-r);

/* ---------- state ---------- */
const COSTS={fert:[40,250,1500,9000,60000,400000,3e6,2.5e7],une:[150,2500,200000],kakashi:[500,6000,80000,1.2e6],tractor:[5000,40000,400000,4e6,4e7],stove:[15000,150000,1.5e6]};
const TRAC_IV=[90,60,40,25,15];
const NST=STAGES.length;
COSTS.tana=[800,12000,300000];COSTS.kura=[300,5000,80000,1.2e6,2e7];COSTS.nobori=[600,9000,150000,2.5e6];
const SHELF=[3,4,6,8],CAP=[40,80,150,300,600,1200];
const PRICE=[{label:'安め',m:.8,p:1},{label:'ふつう',m:1,p:.85},{label:'強気',m:1.5,p:.45}];
const CTYPES=[
  {id:'kinjo',name:'ご近所さん',w:60,qty:()=>1+(Math.random()<.4?1:0),pay:1,shirt:'#7a9a5a',hat:'bun'},
  {id:'chef',name:'料理人',w:15,qty:()=>3+Math.floor(Math.random()*3),pay:1,shirt:'#f4f4f0',hat:'chef'},
  {id:'kanko',name:'観光客',w:20,qty:()=>1+Math.floor(Math.random()*3),pay:1.1,shirt:'#e0703a',hat:'cap'},

];
function fresh(){return{coins:0,total:0,harv:0,stage:0,unlocked:[true,false,false,false,false],fert:0,une:0,kakashi:0,kago:false,dex:{},fields:[[],[],[],[],[]],farmers:[0,0,0,0,0],
  inv:{},shelf:[null,null,null],tana:0,kura:0,nobori:0,rep:1,sold:0,sales:0,lv:1,xp:0,req:[null,null,null],reqNext:[0,0,0],rerollAt:0,ach:{},st:{kira:0,req:0,happy:0,rare:0,combo:0},shiny:{},tractor:0,truck:false,kitchen:false,stoves:1,chef:false,pot:false,burners:[null],dishes:{},cooked:0,v:5,last:Date.now()}}
function migrate(o){
  const s=Object.assign(fresh(),o);
  while(s.unlocked.length<NST)s.unlocked.push(false);
  while(s.fields.length<NST)s.fields.push([]);
  while(s.farmers.length<NST)s.farmers.push(0);
  if(!o.v||o.v<3){s.inv={};s.shelf=[null,null,null]}
  while(s.shelf.length<SHELF[s.tana])s.shelf.push(null);
  s.st=Object.assign({kira:0,req:0,happy:0,rare:0,combo:0},o.st||{});
  while(s.burners.length<s.stoves)s.burners.push(null);
  return s;
}

const invTotal=()=>{let n=0;for(const k in S.inv)n+=S.inv[k];return n};
const invFull=()=>invTotal()>=cap();
const custIv=()=>9/(1+S.rep*0.35)/Math.pow(1.35,S.nobori);

const TITLES=[[1,'見習い農家'],[3,'かけだし農家'],[5,'ふつうの農家'],[8,'腕ききの農家'],[12,'町の名物農家'],[16,'畑の名人'],[21,'やさいっこ博士'],[27,'伝説の農家'],[35,'やさいっこ王']];

const rankMult=()=>1+0.03*(S.lv-1);
let simming=false,lvGain=0;
function gainXp(n){
  S.xp+=n;
  while(S.xp>=needXp(S.lv)){S.xp-=needXp(S.lv);S.lv++;lvGain++;const c=Math.round(50*Math.pow(1.55,S.lv));S.coins+=c;S.total+=c;if(!simming)levelUp(c)}
}
function levelUp(c){
  sfx('level');
  const parts=['売値 +'+Math.round((rankMult()-1)*100)+'%','ごほうび '+fmt(c)+'円'];
  if(DECOR[S.lv])parts.push('新しい飾り：'+DECOR[S.lv]);
  const t=title(S.lv);if(TITLES.some(([l])=>l===S.lv))parts.unshift('称号「'+t+'」');
  showBanner('ランクアップ！ Lv'+S.lv,parts.join(' ・ '));
  for(let i=0;i<20;i++)setTimeout(()=>{if(W)burst(Math.random()*W,H*.2,'star',2,20)},i*40);
}
const SALE={sp:null,until:0,next:Date.now()+120000};
const saleOn=id=>SALE.sp===id&&Date.now()<SALE.until;
function saleTick(){
  const now=Date.now();
  if(SALE.sp&&now>=SALE.until){SALE.sp=null;SALE.next=now+(180+Math.random()*120)*1000}
  if(!SALE.sp&&now>=SALE.next){
    const pool=SP.filter(x=>S.dex[x.id]);if(!pool.length){SALE.next=now+60000;return}
    const shelfIds=S.shelf.filter(Boolean).map(x=>x.sp).filter(id=>S.inv[id]);
    const pick=Math.random()<.5&&shelfIds.length?shelfIds[Math.floor(Math.random()*shelfIds.length)]:pool[Math.floor(Math.random()*pool.length)].id;
    SALE.sp=pick;SALE.until=now+90000;sfx('rare');toast('特売タイム！「'+SPI[pick].name+'」が1.5倍で売れる（90秒）');stallSig='';
  }
}

  restock();

  const want=c.type.qty();let n=0,paid=0,gotWish=false;
  const w=avail.find(x=>x.sp===c.wish);
  const rest=avail.filter(x=>x!==w).sort(()=>Math.random()-.5);
  const order=w?[w,...rest]:rest;
  for(const x of order){
    if(n>=want)break;
    const sp=SPI[x.sp],isWish=x.sp===c.wish,pl=PRICE[x.price];
    const prob=isWish?Math.min(1,pl.p+.35):pl.p*(c.type.id==='kanko'?1.1:1);

  }

}

  try{const b=c.createBuffer(1,1,22050),src=c.createBufferSource();src.buffer=b;src.connect(c.destination);src.start(0)}catch(e){}
  const r=c.resume&&c.resume();if(r&&r.then)r.then(updateSnd,()=>{});
}
function auInit(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(AU.ctx){if(AU.ctx.state!=='running'&&!document.hidden)auUnlock(AU.ctx);updateSnd();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  let c;try{c=new AC()}catch(e){return}
  AU.ctx=c;if(c.addEventListener)c.addEventListener('statechange',updateSnd);
  const comp=c.createDynamicsCompressor();comp.connect(c.destination);
  const master=c.createGain();master.gain.value=.85;master.connect(comp);
  AU.bgmG=c.createGain();AU.bgmG.gain.value=AU.on.bgm?.42:0;AU.bgmG.connect(master);
  AU.sfxG=c.createGain();AU.sfxG.gain.value=AU.on.sfx?.7:0;AU.sfxG.connect(master);
  const buf=c.createBuffer(1,c.sampleRate*.4,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=buf;
  AU.song=SONGS[AU.want];AU.step=0;AU.next=c.currentTime+.15;
  setInterval(auSchedule,25);
  auUnlock(c);
}
function tone(dest,o){
  const c=AU.ctx,t=o.t,osc=c.createOscillator(),g=c.createGain();
  osc.type=o.type||'sine';osc.frequency.setValueAtTime(o.f,t);
  if(o.f2)osc.frequency.exponentialRampToValueAtTime(o.f2,t+(o.sweep||.1));
  let node=osc;if(o.filt){const bq=c.createBiquadFilter();bq.type='lowpass';bq.frequency.value=o.filt;osc.connect(bq);node=bq}
  node.connect(g);g.connect(dest);
  const a=o.a||.005,v=o.v||.1,len=o.len||0,dec=o.d||.3;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);
  if(len){g.gain.setValueAtTime(v,t+a+len);g.gain.exponentialRampToValueAtTime(.0001,t+a+len+dec)}
  else g.gain.exponentialRampToValueAtTime(.0001,t+a+dec);
  osc.start(t);osc.stop(t+a+len+dec+.05);
}
function hiss(dest,t,v,hp,dur){
  const c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=AU.noise;f.type='highpass';f.frequency.value=hp;s.connect(f);f.connect(g);g.connect(dest);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.start(t,Math.random()*.3);s.stop(t+dur+.02);
}
function lead(kind,f,t,dur){
  const d=AU.bgmG;
  if(kind==='ocarina'){tone(d,{type:'triangle',f,t,a:.025,len:dur*.8,d:.09,v:.12});tone(d,{type:'sine',f:f*2,t,a:.03,len:dur*.6,d:.08,v:.02})}
  else if(kind==='bell'){tone(d,{type:'sine',f,t,d:1.6,v:.1});tone(d,{type:'sine',f:f*2.76,t,d:.6,v:.025});tone(d,{type:'sine',f:f*5.4,t,d:.25,v:.01})}
  else if(kind==='steel'){tone(d,{type:'sine',f,t,d:.45,v:.11});tone(d,{type:'sine',f:f*2,t,d:.25,v:.045});tone(d,{type:'triangle',f:f*3,t,d:.12,v:.015})}
  else if(kind==='chip'){tone(d,{type:'square',f,t,a:.004,len:Math.min(dur*.55,.18),d:.06,v:.035,filt:2200});tone(d,{type:'sine',f,t,d:.2,v:.04})}
}
function auSchedule(){
  const c=AU.ctx;if(!c||c.state!=='running')return;
  if(AU.next<c.currentTime-.2)AU.next=c.currentTime+.05;
  while(AU.next<c.currentTime+.12){
    const s=AU.song,e=60/s.bpm/2,st=AU.step%64,bar=Math.floor(st/8),pos=st%8,t=AU.next,d=AU.bgmG;
    const ch=PROG[s.prog[bar]],root=s.root;
    const m=s.mel[st];if(m)lead(s.lead,mf(root+m.n),t,m.l*e);
    if(s.sparse){
      if(pos===0){tone(d,{type:'sine',f:mf(root-12+ch[0]),t,a:.2,len:e*6,d:.8,v:.08});ch.forEach((n,i)=>tone(d,{type:'sine',f:mf(root+n),t:t+i*e*.5,d:1.4,v:.022}))}
      if(pos===4)ch.forEach((n,i)=>tone(d,{type:'sine',f:mf(root+12+n),t:t+i*e*.33,d:.9,v:.012}));
    }else{
      if(pos===0)tone(d,{type:'triangle',f:mf(root-12+ch[0]),t,len:e*1.4,d:.15,v:.16,filt:700});
      if(pos===4)tone(d,{type:'triangle',f:mf(root-12+ch[0]+7),t,len:e*1.2,d:.15,v:.13,filt:700});
      if(pos===2||pos===6)ch.forEach(n=>tone(d,{type:'triangle',f:mf(root+n),t,d:.16,v:.03}));
      if(s.lead==='chip'&&(pos===3||pos===7))ch.forEach(n=>tone(d,{type:'triangle',f:mf(root+n),t,d:.1,v:.018}));
      hiss(d,t,pos%2?.028:.016,7000,.035);
      if(s.kick&&(pos===0||pos===4))tone(d,{type:'sine',f:140,f2:45,sweep:.12,t,d:.14,v:.22});
    }
    AU.step++;
    AU.next+=e*(1+(pos%2?-s.swing:s.swing));
    if(AU.step%8===0&&SONGS[AU.want]!==AU.song){AU.song=SONGS[AU.want];AU.step=0}
  }
}
function auWant(){AU.want=view==='shop'?'shop':view==='kitchen'?'kitchen':S.stage===3?'night':S.stage===4?'beach':'field';updateSnd()}
function sfx(name,arg){
  if(!AU.ctx||!AU.on.sfx||AU.ctx.state!=='running')return;
  const t=AU.ctx.currentTime,d=AU.sfxG;
  switch(name){
    case'pop':{const k=Math.max(-3,Math.min(8,arg||0));tone(d,{type:'sine',f:330+k*45,f2:820+k*90,sweep:.07,t,d:.13,v:k<0?.1:.2});hiss(d,t,.05,1500,.05);break}
    case'new':[0,4,7,12,16].forEach((n,i)=>tone(d,{type:'sine',f:mf(72+n),t:t+i*.075,d:.55,v:.12}));break;
    case'rare':[0,2,4,7,9,12,14,16].forEach((n,i)=>tone(d,{type:'triangle',f:mf(84+n),t:t+i*.045,d:.3,v:.05}));break;
    case'coin':tone(d,{type:'square',f:1318,t,d:.05,v:.04,filt:5000});tone(d,{type:'square',f:1760,t:t+.065,d:.28,v:.04,filt:5000});break;
    case'happy':[0,4,7].forEach((n,i)=>tone(d,{type:'triangle',f:mf(79+n),t:t+.12+i*.06,d:.2,v:.05}));break;
    case'sad':tone(d,{type:'triangle',f:mf(67),t,d:.22,v:.05});tone(d,{type:'triangle',f:mf(63),t:t+.18,d:.35,v:.05});break;
    case'buy':[0,4,7,12].forEach((n,i)=>tone(d,{type:'square',f:mf(72+n),t:t+i*.07,d:.16,v:.035,filt:3000}));break;
    case'tap':tone(d,{type:'sine',f:700,t,d:.06,v:.06});break;
    case'full':tone(d,{type:'square',f:200,t,d:.12,v:.04,filt:900});tone(d,{type:'square',f:160,t:t+.12,d:.18,v:.04,filt:900});break;
    case'rain':hiss(d,t,.05,3000,1.2);break;
    case'putt':if(view==='field')tone(d,{type:'square',f:70+Math.random()*12,t,d:.06,v:.025,filt:300});break;
    case'level':[0,4,7,12,7,12,16,19].forEach((n,i)=>tone(d,{type:i<4?'triangle':'square',f:mf(67+n),t:t+i*.09,d:i===7?.8:.18,v:i<4?.08:.04,filt:3500}));break;
    case'kira':[0,7,12,16,19,24,28,31].forEach((n,i)=>tone(d,{type:'sine',f:mf(76+n),t:t+i*.05,d:.5,v:.07}));break;
  }
}
function updateSnd(){
  const b=$('#snd-bgm'),e=$('#snd-sfx');if(!b)return;
  b.setAttribute('aria-pressed',AU.on.bgm?'true':'false');e.setAttribute('aria-pressed',AU.on.sfx?'true':'false');
  const live=AU.ctx&&AU.ctx.state==='running';
  b.classList.toggle('wait',!live&&(AU.on.bgm||AU.on.sfx));
  b.querySelector('span').textContent=!live&&(AU.on.bgm||AU.on.sfx)?'タップで音を出す':AU.on.bgm?(SONGS[AU.want].name):'BGM オフ';
}
function setSnd(kind){
  const live=AU.ctx&&AU.ctx.state==='running';
  if(!live&&AU.on[kind]){auInit();updateSnd();return}
  AU.on[kind]=!AU.on[kind];auSavePref();auInit();
  if(AU.ctx){const g=kind==='bgm'?AU.bgmG:AU.sfxG,v=AU.on[kind]?(kind==='bgm'?.42:.7):0;g.gain.setTargetAtTime(v,AU.ctx.currentTime,.08)}
  updateSnd();if(kind==='sfx')sfx('tap');
}
['pointerup','click','touchend','keydown'].forEach(ev=>addEventListener(ev,()=>{if(AU.on.bgm||AU.on.sfx)auInit()},{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;if(document.hidden)AU.ctx.suspend();else AU.ctx.resume()});

/* ---------- drawing ---------- */
function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h)}
function star(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}c.closePath();c.fill()}
function twinkle(c,x,y,r){c.beginPath();c.moveTo(x,y-r);c.lineTo(x+r*.25,y-r*.25);c.lineTo(x+r,y);c.lineTo(x+r*.25,y+r*.25);c.lineTo(x,y+r);c.lineTo(x-r*.25,y+r*.25);c.lineTo(x-r,y);c.lineTo(x-r*.25,y-r*.25);c.closePath();c.fill()}
function bodyH(sp,s){
  switch(sp.shape){case'round':return s*.95;case'onion':return s*.95;case'root':return s*(sp.len||1.5);case'long':return s*(sp.len||2);case'boot':return s*1.5;case'cat':return s*1.3;case'rabbit':return s*1.3;case'shell':return s*1.2;case'chest':return s*1.15}

function leaves(c,sp,cx,top,s,k,sil){
  const lc=sil||sp.lc||'#5aa83e',dk=sil||'rgba(0,0,0,.18)';
  const type=sp.leaf||'generic';
  if(type==='tuft'||type==='generic'){
    const angs=type==='generic'?[-.5,.5]:[-.55,0,.55];
    angs.forEach(a=>{c.save();c.translate(cx,top+s*.06);c.rotate(a);c.fillStyle=lc;c.beginPath();c.ellipse(0,-s*.3*k,s*.15*k,s*.32*k,0,0,7);c.fill();
      if(!sil){c.strokeStyle=dk;c.lineWidth=Math.max(1,s*.03);c.beginPath();c.moveTo(0,0);c.lineTo(0,-s*.55*k);c.stroke()}c.restore()});
  }else if(type==='feather'){
    [-.6,-.25,.1,.45].forEach((a,i)=>{c.save();c.translate(cx,top+s*.06);c.rotate(a);c.strokeStyle=lc;c.lineWidth=Math.max(1.2,s*.05);c.beginPath();c.moveTo(0,0);c.lineTo(0,-s*.62*k);c.stroke();
      c.fillStyle=lc;for(let j=1;j<=3;j++){c.beginPath();c.ellipse(0,-s*.2*j*k,s*.12*k,s*.07*k,0,0,7);c.fill()}c.restore()});
  }else if(type==='sprout'){
    [-.18,.14].forEach((a,i)=>{c.save();c.translate(cx,top+s*.06);c.rotate(a);c.strokeStyle=lc;c.lineCap='round';c.lineWidth=Math.max(1.5,s*.09);c.beginPath();c.moveTo(0,0);c.lineTo(0,-s*(i?.6:.75)*k);c.stroke();c.restore()});
  }else if(type==='calyx'){
    c.strokeStyle=lc;c.lineWidth=Math.max(1.5,s*.1);c.lineCap='round';c.beginPath();c.moveTo(cx,top+s*.05);c.lineTo(cx+s*.06,top-s*.28*k);c.stroke();
  }
}
function face(c,sp,cx,ey,s,blink){
  const eye=sp.dark?'#fff6ea':'#3a2a22';
  c.fillStyle=eye;c.strokeStyle=eye;c.lineCap='round';c.lineWidth=Math.max(1.2,s*.055);
  const ex=s*.18,er=Math.max(1.3,s*.055);
  const f=sp.face;

  else{[-1,1].forEach(d=>{c.beginPath();c.arc(cx+d*ex,ey,er*(f==='oh'?1.25:1),0,7);c.fill()})}
  if(f==='grumpy'){[-1,1].forEach(d=>{c.beginPath();c.moveTo(cx+d*ex*1.5,ey-s*.14);c.lineTo(cx+d*ex*.5,ey-s*.09);c.stroke()})}

  c.beginPath();
  if(f==='smile'){c.arc(cx,my-s*.04,s*.07,Math.PI*.15,Math.PI*.85);c.stroke()}
  else if(f==='oh'){c.arc(cx,my,s*.045,0,7);c.fill()}
  else if(f==='sleepy'){c.arc(cx,my,s*.035,0,7);c.stroke()}
  else if(f==='grumpy'){c.moveTo(cx-s*.06,my);c.lineTo(cx+s*.06,my);c.stroke()}
  else if(f==='kiss'){c.arc(cx,my-s*.02,s*.03,-Math.PI/2,Math.PI/2);c.stroke();c.beginPath();c.arc(cx,my+s*.04,s*.03,-Math.PI/2,Math.PI/2);c.stroke()}
  if(f!=='grumpy'){c.fillStyle=sp.dark?'rgba(255,150,170,.35)':'rgba(240,110,120,.32)';[-1,1].forEach(d=>{c.beginPath();c.arc(cx+d*s*.3,ey+s*.12,s*.08,0,7);c.fill()})}
}
function shade(c,cx,top,w,h,col){c.save();c.clip();c.fillStyle=col;c.globalAlpha=.55;c.fillRect(cx+w*.42,top-2,w,h+4);c.restore()}
function drawSp(c,sp,cx,top,s,o){
  o=o||{};const sil=o.sil,fill=col=>{c.fillStyle=sil||col};
  const h=bodyH(sp,s),k=o.leaf==null?1:o.leaf;

    if(!sil){c.fillStyle=sp.sh;c.fillRect(cx-w,top+s*.38,w*2,s*.06);c.fillStyle='#f2c53d';c.fillRect(cx-s*.08,top,s*.16,s*1.15);c.fillRect(cx-w,top+s*1.02,w*2,s*.06);
      rr(c,cx-s*.12,top+s*.32,s*.24,s*.2,s*.04);c.fill();c.fillStyle='#3a2a22';c.beginPath();c.arc(cx,top+s*.42,s*.035,0,7);c.fill();
      if(!o.noSparkle){c.fillStyle='#fff3b0';twinkle(c,cx-w-s*.1,top+s*.15,s*.13);twinkle(c,cx+w+s*.08,top+s*.6,s*.1)}}

  }

  fill(sp.col);
  let w=s*.5;
  if(sp.shape==='round'||sp.shape==='onion'){
    const cy=top+h*.48;
    c.beginPath();
    if(sp.shape==='onion'){c.moveTo(cx,top-s*.05);c.quadraticCurveTo(cx+w*1.2,top+h*.25,cx+w,top+h*.6);c.quadraticCurveTo(cx+w*.7,top+h,cx,top+h);c.quadraticCurveTo(cx-w*.7,top+h,cx-w,top+h*.6);c.quadraticCurveTo(cx-w*1.2,top+h*.25,cx,top-s*.05)}

    c.fill();
    if(!sil&&sp.ext&&sp.ext.includes('stripes')){c.save();c.beginPath();c.ellipse(cx,cy,w,h*.48,0,0,7);c.clip();c.strokeStyle='#1f5e2a';c.lineWidth=Math.max(1.5,s*.07);[-.6,-.25,.1,.45].forEach(d=>{c.beginPath();c.moveTo(cx+d*w,top);for(let y=0;y<=h;y+=s*.1)c.lineTo(cx+d*w+Math.sin(y/s*9)*s*.04,top+y);c.stroke()});c.restore()}

function collect(st,sp,silent,shiny){
  if(invFull())return null;
  const isNew=!S.dex[sp.id];
  S.dex[sp.id]=(S.dex[sp.id]||0)+1;S.harv++;S.inv[sp.id]=(S.inv[sp.id]||0)+1;
  autoShelf(sp.id);

  if(shiny){
    const bonus=Math.round(sp.val*fieldMult(st)*20*rankMult());S.coins+=bonus;S.total+=bonus;S.st.kira++;S.shiny[sp.id]=(S.shiny[sp.id]||0)+1;xp+=100;dexDirty=true;

    dexDirty=true;

      toast('図鑑に登録：'+sp.name+'（'+STARS(sp.r)+'）');dexSel=sp.id;

    if(!S.unlocked[st]||!S.farmers[st])continue;
    const fr=farmerRT[st];fr.cool-=dt;fr.pull=Math.max(0,fr.pull-dt);
    if(invFull()){fr.target=-1;fr.walking=false;continue}
    if(st!==S.stage||view!=='field'){
      fr.target=-1;if(st!==S.stage)fr.x=null;fr.walking=false;

    if(fr.target>=0&&!ripe(S.fields[st][fr.target]))fr.target=-1;
    if(fr.target<0&&fr.cool<=0){fr.target=nearestRipe(st,fr.x,fr.y);if(fr.target<0)fr.cool=.8}
    fr.walking=false;
    if(fr.target>=0){
      const p=L[fr.target],tx=p.x-p.s*.9,ty=p.gy+p.s*.45;
      const dx=tx-fr.x,dy=ty-fr.y,d=Math.hypot(dx,dy),spd=Math.max(80,W*.35);

      else{const m=Math.min(d,spd*dt);fr.x+=dx/d*m;fr.y+=dy/d*m;fr.walking=true}

}
let custAcc=0;
function simFarmers(from,end,acc){
  for(let st=0;st<NST;st++){
    if(!S.unlocked[st]||!S.farmers[st])continue;
    const iv=farmIv(st)*1000;let tt=from;
    while(tt+iv<=end){
      tt+=iv;const f=S.fields[st];let bi=-1,bt=Infinity;
      f.forEach((sl,i)=>{const r=sl.t0+sl.dur;if(r<=tt&&r<bt){bt=r;bi=i}});
      if(bi<0){const nx=Math.min(...f.map(sl=>sl.t0+sl.dur));if(!isFinite(nx)||nx>end)break;tt=Math.max(tt,nx-iv);continue}
      const sp=SPI[f[bi].sp];const r=collect(st,sp,true,f[bi].shiny);if(!r)break;
      acc.n++;if(r.isNew)acc.news.push(sp.name);
      f[bi]=plant(st,tt);
    }
  }
}

let custs=[],nextCust=Date.now()+4000;
const SPOTS=[.24,.5,.76];
function custTick(dt){
  const now=Date.now();
  if(S.harv&&now>=nextCust&&W){
    const used=custs.filter(c=>c.state!=='out').map(c=>c.spot);
    const free=[0,1,2].filter(i=>!used.includes(i));
    if(free.length){
      const c=newCust();c.spot=free[Math.floor(Math.random()*free.length)];c.x=W+30;c.state='in';c.t=0;c.look=Math.random();
      custs.push(c);nextCust=now+custIv()*1000*(0.7+Math.random()*0.6);
    }else nextCust=now+1000;
  }
  const spd=Math.max(70,W*.3);
  custs.forEach(c=>{
    c.t+=dt;
    if(c.state==='in'){const tx=W*SPOTS[c.spot];const d=tx-c.x;if(Math.abs(d)<3){c.state='wait';c.t=0}else c.x+=Math.sign(d)*Math.min(Math.abs(d),spd*dt)}
    else if(c.state==='wait'&&c.t>1.6){c.res=serve(c);c.state='pay';c.t=0;if(c.res.paid){const cb=$('#coinbox');cb.classList.remove('bump');void cb.offsetWidth;cb.classList.add('bump')}}
    else if(c.state==='pay'&&c.t>1.3){c.state='out';c.t=0}
    else if(c.state==='out')c.x-=spd*dt;
  });
  custs=custs.filter(c=>c.x>-60);
}

      if(!q){d.className='req empty';d.innerHTML='<span class="rwait" data-i="'+i+'"></span>';box.appendChild(d);return}
      const sp=SPI[q.sp];d.className='req';
      const c=document.createElement('canvas');d.appendChild(c);
      const info=document.createElement('div');info.className='rinfo';
      info.innerHTML='<div class="rwho"></div><div class="rwant"></div><div class="rhave" data-i="'+i+'"></div><div class="rrew"></div>';
      info.querySelector('.rwho').textContent=q.who;
      info.querySelector('.rwant').textContent='「'+sp.name+'を '+q.n+'本 ほしいな」';
      info.querySelector('.rrew').textContent='お礼 '+fmt(q.coins)+'円 ・ 経験値 +'+q.xp;
      d.appendChild(info);
      const b=document.createElement('button');b.type='button';b.className='buy';b.dataset.i=i;b.textContent='わたす';b.onclick=()=>deliver(i);d.appendChild(b);
      box.appendChild(d);miniCanvas(c,sp,false,48,54);
    });
  }
  box.querySelectorAll('.rhave').forEach(el=>{const q=S.req[+el.dataset.i];if(!q)return;const h=S.inv[q.sp]||0;el.textContent='倉庫に '+h+' / '+q.n+'本';el.classList.toggle('ok',h>=q.n)});
  box.querySelectorAll('.req .buy').forEach(b=>{const q=S.req[+b.dataset.i];const ok=q&&(S.inv[q.sp]||0)>=q.n;b.classList.toggle('poor',!ok);b.setAttribute('aria-disabled',ok?'false':'true');b.parentNode.classList.toggle('ok',!!ok)});
  box.querySelectorAll('.rwait').forEach(el=>{const i=+el.dataset.i;el.textContent=SP.some(x=>S.dex[x.id])?'次のお願いが届くまで、あと '+fmtSec((S.reqNext[i]-Date.now())/1000):'やさいっこを収穫すると、町の人からお願いが届くようになります'});
  const rr=$('#reroll'),cd=S.rerollAt-Date.now();rr.disabled=cd>0;rr.textContent=cd>0?'かえられるまで '+fmtSec(cd/1000):'ほかのお願いにかえる';
}
function renderAch(){
  const box=$('#achs');
  const sig=ACH.map(a=>(S.ach[a.id]||0)+':'+(a.get()>=(a.tiers[S.ach[a.id]||0]||Infinity))).join();
  if(sig!==achSig){
    achSig=sig;box.innerHTML='';
    ACH.forEach(a=>{
      const k=S.ach[a.id]||0,done=k>=a.tiers.length,goal=done?a.tiers[a.tiers.length-1]:a.tiers[k],ok=!done&&a.get()>=goal;
      const d=document.createElement('div');d.className='ach'+(ok?' ok':'')+(done?' done':'');
      d.innerHTML='<div class="amain"><div class="aname"><span></span><span class="astars"></span></div><div class="agoal"></div><div class="need"><span class="pbar"><i></i></span><span class="needt" data-a="'+a.id+'"></span></div></div>';
      d.querySelector('.aname span').textContent=a.name;
      d.querySelector('.astars').textContent='★'.repeat(k)+'☆'.repeat(a.tiers.length-k);
      d.querySelector('.agoal').textContent=done?'すべて達成！':'目標：'+fmt(goal)+a.unit+'　ごほうび '+fmt(achReward(k).coins)+'円 ・ 経験値 +'+achReward(k).xp;
      const b=document.createElement('button');b.type='button';b.className='buy'+(done?' done':ok?'':' poor');b.textContent=done?'達成':ok?'受け取る':'まだ';
      if(ok)b.onclick=()=>claimAch(a.id);
      d.appendChild(b);box.appendChild(d);
    });
  }
  box.querySelectorAll('.needt').forEach(el=>{const a=ACH.find(x=>x.id===el.dataset.a),k=S.ach[a.id]||0,goal=a.tiers[Math.min(k,a.tiers.length-1)],v=a.get();
    el.textContent=fmt(Math.min(v,goal))+' / '+fmt(goal)+a.unit;el.parentNode.querySelector('.pbar i').style.width=Math.min(100,v/goal*100)+'%'});
  const tot=ACH.reduce((a,x)=>a+x.tiers.length,0),got=ACH.reduce((a,x)=>a+(S.ach[x.id]||0),0);
  $('#achcount').textContent='実績 ★'+got+' / '+tot;$('#achsub').textContent='ランク Lv'+S.lv+'「'+title(S.lv)+'」';
}
$('#quick-all').onclick=()=>{selectTab('shop');const b=document.querySelector('.book');if(b&&b.scrollIntoView)b.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'})};$('#t-dex').onclick=()=>selectTab('dex');

/* ---------- status / ui ---------- */
function updateUI(){
  $('#coins').textContent=fmt(S.coins);
  $('#rlv').textContent='Lv'+S.lv;$('#rtitle').textContent=title(S.lv);$('#rbar').style.width=Math.min(100,S.xp/needXp(S.lv)*100)+'%';
  $('.rank').title='次のランクまで 経験値 '+(needXp(S.lv)-S.xp);
  const canDeliver=S.req.filter(q=>q&&(S.inv[q.sp]||0)>=q.n).length;
  const tr=$('#t-req .n');tr.hidden=!canDeliver;tr.textContent=canDeliver;
  const pr=$('#pill-req');pr.hidden=!canDeliver;pr.textContent='お願い '+canDeliver+'件 わたせます';
  const ac=achClaimable(),ta=$('#t-ach .n');ta.hidden=!ac;ta.textContent=ac;
  const sc=$('#sale');if(SALE.sp&&saleOn(SALE.sp)){sc.hidden=false;const on=S.shelf.some(x=>x&&x.sp===SALE.sp);sc.textContent='特売タイム：'+SPI[SALE.sp].name+'が1.5倍・あと'+fmtSec((SALE.until-Date.now())/1000)+(on?'（棚にあります）':'（棚に並べると売れやすい）')}else sc.hidden=true;
  if(curTab==='req')renderReq();if(curTab==='ach')renderAch();
  const f=S.fields[S.stage],now=Date.now();
  const r=f.filter(ripe).length;
  const next=f.filter(s=>!ripe(s)).reduce((m,s)=>Math.min(m,s.t0+s.dur-now),Infinity);
  const tot=invTotal(),full=tot>=cap();
  const meter='倉庫 <b>'+tot+'</b> / '+cap()+'<span class="meter'+(full?' full':'')+'"><i style="width:'+Math.min(100,tot/cap()*100)+'%"></i></span>';
  let st;
  if(view==='field'){
    st='収穫できる <b>'+r+'</b> / '+f.length+(isFinite(next)?' ・ 次は '+fmtSec(next/1000)+'後':'')+'<br>'+meter;
    if(S.farmers[S.stage])st+='<br>'+FARMERS[S.stage].name+(full?'は倉庫がいっぱいで休憩中':'が収穫中（'+farmIv(S.stage)+'秒に1本）');
  }else if(view==='kitchen'){
    const busy=S.burners.filter(Boolean).length;
    st=S.kitchen?'コンロ <b>'+busy+'</b> / '+S.burners.length+' 使用中'+(S.chef?' ・ 料理人さんがおまかせ調理中':'')+'<br>作った料理 <b>'+S.cooked.toLocaleString('ja-JP')+'</b>品 ・ '+meter:'台所はまだありません ・ '+meter;
  }else{
    st='評判 <b class="stars">'+'★'.repeat(Math.round(S.rep))+'☆'.repeat(5-Math.round(S.rep))+'</b> ・ お客さんは約'+custIv().toFixed(1)+'秒に1人<br>これまでに <b>'+S.sold.toLocaleString('ja-JP')+'</b>本 売れた ・ '+meter;
  }
  $('#status').innerHTML=st;
  $('#stages').hidden=view!=='field';$('#stall').hidden=view!=='shop';$('#kitchen').hidden=view!=='kitchen';$('#tip').hidden=view!=='field';
  if(view==='kitchen')renderKitchen();
  const canCook=S.kitchen&&S.burners.includes(null)&&RECIPES.some(rcCan);const vk=$('#vn-kitchen');vk.hidden=view==='kitchen'||!canCook;vk.textContent='作れる';
  const se=SEASONS[seasonIdx()],left=SEASON_MS-(Date.now()%SEASON_MS),sh=se.shun.filter(id=>S.dex[id]).map(id=>SPI[id].name);
  $('#season').textContent='いまは'+se.n+'（'+SEASONS[(seasonIdx()+1)%4].n+'まで '+fmtSec(left/1000)+'）・ 旬'+(sh.length?'の '+sh.slice(0,3).join('、')+(sh.length>3?' ほか':'')+' は1.3倍':'の子はまだ見つかっていません');
  if(S.tractor&&view==='field'){const T=TR[S.stage];st+='<br>トラクター Lv'+S.tractor+'：'+(T.run?'回収中！':'次の出動まで '+fmtSec(Math.max(0,T.next-Date.now())/1000));$('#status').innerHTML=st}
  const totalRipe=S.fields.reduce((a,fl,i)=>a+(S.unlocked[i]?fl.filter(ripe).length:0),0);
  const vf=$('#vn-field');vf.hidden=view==='field'||!totalRipe;vf.textContent=totalRipe;
  const out=S.shelf.filter(x=>x&&!S.inv[x.sp]).length+S.shelf.filter(x=>!x).length*(Object.keys(S.inv).length?1:0);
  const vs=$('#vn-shop');vs.hidden=view==='shop'||!(full||out);vs.textContent=full?'満杯':'品切れ';
  if(view==='shop')renderStall();
  const wx=$('#wx');
  if(weatherOn('ame')||weatherOn('niji')){wx.hidden=false;const left=fmtSec((WX.until-now)/1000);wx.className='wx '+WX.type;wx.textContent=WX.type==='ame'?'雨：育つのが2倍・あと'+left:'虹：めずらしい子が出やすい・あと'+left}
  else wx.hidden=true;
  const all=$('#all');all.hidden=!S.kago||view!=='field';all.setAttribute('aria-disabled',r?'false':'true');
  document.querySelectorAll('#stages button').forEach(b=>{const i=+b.dataset.i,n=b.querySelector('.n');if(!n)return;const c=S.fields[i].filter(ripe).length;n.hidden=!c||i===S.stage;n.textContent=c});
  renderShop();
  if(!$('#p-dex').hidden)renderDex();else{const found=SP.filter(s=>S.dex[s.id]).length;$('#dexline').textContent='図鑑 '+found+' / '+SP.length}
}

/* ---------- stall panel ---------- */
let stallSig='';
const spOrder=(a,b)=>SPI[a].st-SPI[b].st||SPI[a].r-SPI[b].r||SP.indexOf(SPI[a])-SP.indexOf(SPI[b]);
function wholesaleValue(){let v=0;for(const k in S.inv){if(S.shelf.some(x=>x&&x.sp===k))continue;v+=S.inv[k]*Math.max(1,Math.round(unitPrice(SPI[k],1)*.5))}return v}
function renderStall(){
  const keys=Object.keys(S.inv).filter(k=>S.inv[k]>0).sort(spOrder);
  const sig=JSON.stringify(S.shelf)+'|'+keys.join();
  if(sig!==stallSig){
    stallSig=sig;
    const sh=$('#shelf');sh.innerHTML='';
    S.shelf.forEach((e,i)=>{
      const d=document.createElement('div');
      if(!e){d.className='slot empty';d.textContent='空き棚。下の倉庫から、並べたい子をえらぼう';sh.appendChild(d);return}
      const sp=SPI[e.sp];d.className='slot';
      const c=document.createElement('canvas');d.appendChild(c);
      const info=document.createElement('div');info.innerHTML='<div class="nm"></div><div class="meta" data-slot="'+i+'"></div>';info.querySelector('.nm').textContent=sp.name;d.appendChild(info);
      const ctl=document.createElement('div');ctl.className='slot-ctl';
      const pr=document.createElement('div');pr.className='price';pr.setAttribute('role','group');pr.setAttribute('aria-label',sp.name+'の値札');
      PRICE.forEach((p,j)=>{const b=document.createElement('button');b.type='button';b.textContent=p.label;b.setAttribute('aria-pressed',e.price===j?'true':'false');b.onclick=()=>{e.price=j;stallSig='';renderStall()};pr.appendChild(b)});
      const x=document.createElement('button');x.type='button';x.className='x';x.textContent='外す';x.setAttribute('aria-label',sp.name+'を棚から外す');x.onclick=()=>{S.shelf[i]=null;stallSig='';renderStall()};
      ctl.appendChild(pr);ctl.appendChild(x);d.appendChild(ctl);sh.appendChild(d);
      miniCanvas(c,sp,false,48,54);
    });
    const iv=$('#inv');iv.innerHTML='';
    if(!keys.length){iv.innerHTML='<p class="legend">倉庫はからっぽ。畑で収穫すると、ここにたまります。</p>'}
    keys.forEach(k=>{
      const sp=SPI[k],on=S.shelf.some(x=>x&&x.sp===k);
      const b=document.createElement('button');b.type='button';b.className='invi'+(on?' on':'');
      const c=document.createElement('canvas');b.appendChild(c);
      const info=document.createElement('div');info.innerHTML='<div class="nm"></div><div class="meta" data-inv="'+k+'"></div>';info.querySelector('.nm').textContent=sp.name;b.appendChild(info);
      b.onclick=()=>{
        if(on)return;
        const j=S.shelf.indexOf(null);
        if(j<0){toast('棚がいっぱい。どれかを「外す」と並べられます');return}
        S.shelf[j]={sp:k,price:1};stallSig='';renderStall();toast(sp.name+'を棚に並べました');
      };
      iv.appendChild(b);miniCanvas(c,sp,false,36,40);
    });
  }
  document.querySelectorAll('#shelf .meta').forEach(m=>{const e=S.shelf[+m.dataset.slot];if(!e)return;const n=S.inv[e.sp]||0;m.textContent=n?'在庫 '+n+' ・ 1本 '+fmt(unitPrice(SPI[e.sp],e.price))+'円'+(shun(e.sp)?' ・ 旬':'')+(saleOn(e.sp)?' ・ 特売':''):'品切れ（倉庫に在庫なし）';m.classList.toggle('out',!n)});
  document.querySelectorAll('#inv .meta').forEach(m=>{const k=m.dataset.inv,on=S.shelf.some(x=>x&&x.sp===k);m.textContent=(S.inv[k]||0)+'本'+(on?' ・ 棚にあり':' ・ タップで並べる')});
  $('#shelfinfo').textContent=S.shelf.filter(Boolean).length+' / '+S.shelf.length+'種';
  $('#invinfo').textContent=invTotal()+' / '+cap()+'本';
  const wv=wholesaleValue(),wb=$('#wholesale');
  $('#whinfo').textContent=wv?'市場に卸すと '+fmt(wv)+'円':'卸せる子はいません';
  wb.setAttribute('aria-disabled',wv?'false':'true');
}
$('#wholesale').onclick=()=>{
  const v=wholesaleValue();if(!v)return;let n=0;
  for(const k of Object.keys(S.inv)){if(S.shelf.some(x=>x&&x.sp===k))continue;n+=S.inv[k];delete S.inv[k]}
  S.coins+=v;S.total+=v;stallSig='';toast(n+'本を市場に卸して '+fmt(v)+'円');updateUI();
};
function setView(v){
  if(view!==v)sfx('tap');
  view=v;auWant();['field','shop','kitchen'].forEach(k=>$('#v-'+k).setAttribute('aria-selected',v===k));kitSig='';
  cv.style.cursor=v==='field'?'grab':'default';cv.style.touchAction=v==='field'?'none':'auto';
  stallSig='';updateUI();
}
$('#v-field').onclick=()=>setView('field');$('#v-shop').onclick=()=>setView('shop');$('#v-kitchen').onclick=()=>setView('kitchen');
function renderKitchen(){
  const box=$('#recipes');
  const sig=S.kitchen+'|'+RECIPES.map(r=>(rcKnown(r)?1:0)+''+(S.dishes[r.id]?1:0)).join('')+'|'+S.burners.map(b=>b?b.rc:'-').join();
  if(sig!==kitSig){
    kitSig=sig;box.innerHTML='';
    if(!S.kitchen){box.innerHTML='<p class="legend">まだ台所がありません。上の「すぐ強化」か道具屋から、台所をつくれます。</p>';}
    else RECIPES.forEach(rc=>{
      const known=rcKnown(rc),d=document.createElement('div');d.className='recipe'+(known?'':' unknown');
      const c=document.createElement('canvas');d.appendChild(c);
      const info=document.createElement('div');info.className='rinfo';
      info.innerHTML='<div class="nm"></div><div class="ings"></div><div class="rmeta"></div>';
      info.querySelector('.nm').textContent=known||S.dishes[rc.id]?rc.name+(S.dishes[rc.id]?'':'（はじめて）'):'？？？';
      const ings=info.querySelector('.ings');
      Object.entries(rc.ing).forEach(([id,n])=>{const sp=document.createElement('span');sp.className='ing';sp.dataset.id=id;sp.dataset.n=n;sp.textContent=(S.dex[id]?SPI[id].name:'？？')+' ×'+n;ings.appendChild(sp)});
      info.querySelector('.rmeta').textContent=known?'売値 '+fmt(rcValue(rc))+'円 ・ '+fmtSec(rcTime(rc))+' ・ 作った数 '+(S.dishes[rc.id]||0):'材料のやさいっこを見つけると作れます';
      d.appendChild(info);
      const b=document.createElement('button');b.type='button';b.className='buy';b.dataset.rc=rc.id;b.textContent='つくる';
      b.onclick=()=>{if(!rcCan(rc)){sfx('full');toast('材料がたりません');return}if(!S.burners.includes(null)){sfx('full');toast('コンロがあいていません');return}startCook(rc.id);sfx('pop',2);updateUI()};
      if(known)d.appendChild(b);
      box.appendChild(d);drawDishCanvas(c,rc,!S.dishes[rc.id]);
    });
  }
  box.querySelectorAll('.ing').forEach(el=>{const h=S.inv[el.dataset.id]||0;el.classList.toggle('ok',h>=+el.dataset.n);el.title='倉庫に '+h+'本'});
  const free=S.burners.includes(null);
  box.querySelectorAll('.recipe .buy').forEach(b=>{const ok=rcCan(RCI[b.dataset.rc])&&free;b.classList.toggle('poor',!ok);b.setAttribute('aria-disabled',ok?'false':'true');b.parentNode.classList.toggle('ok',ok)});
  $('#kitinfo').textContent='料理図鑑 '+RECIPES.filter(r=>S.dishes[r.id]).length+' / '+RECIPES.length;
}
function drawDishCanvas(cvs,rc,sil){
  const d=Math.min(2,window.devicePixelRatio||1);cvs.width=48*d;cvs.height=48*d;const c=cvs.getContext('2d');c.setTransform(d,0,0,d,0,0);
  drawDish(c,rc,24,26,16,{sil:sil?(getComputedStyle(document.documentElement).getPropertyValue('--line').trim()||'#ccc'):null});
}

/* ---------- reset ---------- */
function askReset(){
  const box=$('#resetbox');box.innerHTML='<div class="confirm">図鑑もふくめて全部消えます。<button type="button" class="danger" id="rs-yes">消す</button><button type="button" id="rs-no">やめる</button></div>';
  $('#rs-no').onclick=restoreReset;
  $('#rs-yes').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}S=fresh();firstPlant();shopSig='';stallSig='';custs=[];dexDirty=true;dexSel=null;renderStages();updateUI();restoreReset();toast('はじめからになりました')};
}
function restoreReset(){$('#resetbox').innerHTML='<button id="reset" class="reset" type="button">セーブデータを消す</button>';$('#reset').onclick=askReset}
$('#reset').onclick=askReset;
function firstPlant(){fillFields();const now=Date.now();S.fields[0].forEach((sl,i)=>{if(i<3)sl.t0=now-sl.dur-1})}

/* ---------- boot ---------- */
function drawLogo(){
  const lc=$('#logo'),d=Math.min(2,window.devicePixelRatio||1);lc.width=56*d;lc.height=56*d;
  const c=lc.getContext('2d');c.setTransform(d,0,0,d,0,0);
  c.fillStyle='#9a6a40';c.beginPath();c.ellipse(28,50,26,10,0,0,7);c.fill();
  c.save();c.beginPath();c.rect(0,0,56,48);c.clip();drawSp(c,SPI.daikon,28,22,17,{});c.restore();
  c.fillStyle='#734b29';c.beginPath();c.ellipse(28,48,11,3,0,0,7);c.fill();
}
let lastTick=Date.now();
function tick(){
  const now=Date.now(),dt=(now-lastTick)/1000;lastTick=now;
  if(dt>5){awayReport(simulateAway(now-dt*1000,now),dt);return}
  weatherTick(dt);farmerTick(dt);tractorTick(dt);custTick(dt);saleTick();reqTick();kitchenTick();seasonTick();shipOverflow(false);
}
function awayReport(r,sec){
  dexDirty=true;stallSig='';
  if(sec<=60)return;
  if(r.n||r.sold){
    let m='おかえりなさい。留守のあいだに'+(r.n?'農家さんとトラクターが '+r.n+'本 収穫し、':'')+(r.dish?'台所で '+r.dish+'品の料理ができ、':'')+'直売所では '+r.cust+'人 のお客さんに '+r.sold+'本 売れて、'+fmt(r.coins)+'円 になりました';
    if(invFull())m+='。倉庫がいっぱいです';
    if(r.lvUp)m+='。ランクが Lv'+S.lv+'「'+title(S.lv)+'」に上がりました';
    if(r.news.length)m+='。新しく見つけた子：'+r.news.slice(0,4).join('、')+(r.news.length>4?' ほか'+(r.news.length-4)+'種':'');
    showWelcome(m);dexDirty=true;
  }else if(sec>60){let n=0;S.fields.forEach((f,i)=>{if(S.unlocked[i])n+=f.filter(ripe).length});if(n)toast('おかえりなさい。'+n+'本 育っていました')}
}
function showWelcome(m){const el=$('#welcome');el.querySelector('p').textContent=m;el.hidden=false}
function frame(t){tick();draw(t);requestAnimationFrame(frame)}
function start(data){
  let saved=null;
  if(data&&data.S)S=migrate(data.S);
  else{saved=load();if(saved)S=saved;else firstPlant()}
  fillFields();
  if(saved){
    const now=Date.now(),away=(now-S.last)/1000;
    if(away>5)awayReport(simulateAway(S.last,now),away);
  }
  lastTick=Date.now();
  $('#snd-bgm').onclick=()=>setSnd('bgm');$('#snd-sfx').onclick=()=>setSnd('sfx');
  drawLogo();
  resize();renderStages();updateUI();
  if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe(cv);else addEventListener('resize',resize);
  setInterval(updateUI,500);setInterval(save,5000);setInterval(()=>{if(document.hidden)tick()},1000);
  $('#welcome button').onclick=()=>{$('#welcome').hidden=true};
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});
  addEventListener('pagehide',save);
  requestAnimationFrame(frame);
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot){try{hot.snapshot(()=>({S}))}catch(e){}}
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data||{});
})();
</script>
